name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Build & Test ──────────────────────────────────────────────────────────
  build:
    name: Build & Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install kernel headers (needed by netlink/wgctrl)
        run: sudo apt-get install -y linux-headers-$(uname -r) || true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum is up-to-date
        run: |
          cp go.sum go.sum.bak
          go mod tidy
          diff go.sum go.sum.bak || (echo "go.sum is out of date — run 'go mod tidy'" && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Build all binaries
        run: go build ./cmd/...

      - name: Run tests
        run: go test -v -race -timeout 60s ./...

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── Release binaries ──────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build release binaries (linux/amd64 + linux/arm64)
        run: |
          mkdir -p dist
          for GOARCH in amd64 arm64; do
            GOOS=linux GOARCH=$GOARCH CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/bgpd-core-linux-$GOARCH   ./cmd/core
            GOOS=linux GOARCH=$GOARCH CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/bgpd-agent-linux-$GOARCH  ./cmd/agent
            GOOS=linux GOARCH=$GOARCH CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
              -o dist/bgpctl-linux-$GOARCH      ./cmd/bgpctl
          done
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
