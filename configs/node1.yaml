# ─── bgpd-agent configuration — Node 1 ───────────────────────────────────────
# Datacenter: DC1 / Provider A
# Assigned at runtime: 203.0.113.0/26  WG IP: 10.100.0.2

log_level: info

# Unique node identifier (used in the registry and subnet assignment).
node_id: "node1"

# Private BGP ASN for this node. Must be unique across all nodes.
# Use range 64512–65534 for private ASNs not already taken by the core.
asn: 65001

# ─── Core connection ──────────────────────────────────────────────────────────
core:
  # Core router's PUBLIC IP — used for the initial registration call and
  # for configuring the WireGuard endpoint before the tunnel is up.
  public_ip: "YOUR_CORE_PUBLIC_IP"   # e.g. 198.51.100.100
  api_port: 8080
  # Must match core.yaml api.api_key exactly.
  api_key: "YOUR_SECRET_API_KEY_HERE"

# ─── WireGuard ────────────────────────────────────────────────────────────────
wireguard:
  interface: "wg0"
  # Node's OWN public IP — used as the WireGuard endpoint reported to the core.
  public_ip: "YOUR_NODE1_PUBLIC_IP"  # e.g. 203.0.113.10
  listen_port: 51820
  mtu: 1420
  # Leave empty on first run — the agent will generate a keypair and print it.
  # Copy the private_key output here to persist it across restarts.
  private_key: ""

# ─── BGP session to core ──────────────────────────────────────────────────────
bgp:
  hold_time: 90
  keepalive: 30

# How often to send liveness pings to the core API.
heartbeat_interval: "30s"
