# ─── bgpd-agent configuration — Node 1 ───────────────────────────────────────
# Datacenter: DC1 / Provider A
# Assigned at runtime: 203.0.113.0/26  WG IP: 10.100.0.2
#
# Single-ASN (iBGP): no asn field needed here.
# The core returns the shared ASN in the registration response.

log_level: info

node_id: "node1"

core:
  public_ip: "YOUR_CORE_PUBLIC_IP"   # e.g. 198.51.100.100
  api_port: 8080
  api_key: "YOUR_SECRET_API_KEY_HERE"

wireguard:
  interface: "wg0"
  public_ip: "YOUR_NODE1_PUBLIC_IP"
  listen_port: 51820
  mtu: 1420
  private_key: ""   # generated on first run; copy the printed value here

bgp:
  hold_time: 90
  keepalive: 30

heartbeat_interval: "30s"
