# ─── bgpd-agent configuration — Node 3 ───────────────────────────────────────
# Datacenter: DC3 / Provider C
# Assigned at runtime: 203.0.113.128/26  WG IP: 10.100.0.4

log_level: info

node_id: "node3"
asn: 65003

core:
  public_ip: "YOUR_CORE_PUBLIC_IP"
  api_port: 8080
  api_key: "YOUR_SECRET_API_KEY_HERE"

wireguard:
  interface: "wg0"
  public_ip: "YOUR_NODE3_PUBLIC_IP"  # e.g. 203.0.113.138
  listen_port: 51820
  mtu: 1420
  private_key: ""   # generated on first run

bgp:
  hold_time: 90
  keepalive: 30

heartbeat_interval: "30s"
