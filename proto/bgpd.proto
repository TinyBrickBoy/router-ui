// bgpd.proto — control-plane protocol definition (reference / future gRPC migration)
// The HTTP/JSON control plane in this implementation mirrors these types exactly.
// Run `make proto` if you want the generated gRPC stubs.
syntax = "proto3";

package bgpd.v1;

option go_package = "github.com/tinybrickboy/router-ui/gen/bgpd";

// ─── Node Registration ───────────────────────────────────────────────────────

message RegisterRequest {
  string node_id       = 1; // unique name for this node, e.g. "node1"
  uint32 asn           = 2; // private ASN for this node, e.g. 65001
  string public_ip     = 3; // node's public IPv4 for WireGuard endpoint
  uint32 wg_port       = 4; // WireGuard listen port (default 51820)
  string wg_public_key = 5; // WireGuard public key (base64)
}

message RegisterResponse {
  string wg_ip             = 1; // assigned WireGuard tunnel IP, e.g. "10.100.0.2"
  string assigned_subnet   = 2; // assigned prefix, e.g. "203.0.113.0/26"
  string core_wg_ip        = 3; // core WireGuard IP, e.g. "10.100.0.1"
  string core_wg_public_key = 4;
  string core_public_ip    = 5; // core's public IP for WireGuard endpoint
  uint32 core_wg_port      = 6;
  string bgp_peer_ip       = 7; // BGP neighbor IP = core WireGuard IP
  uint32 bgp_peer_asn      = 8; // core ASN
  string error             = 9; // non-empty on failure
}

// ─── Heartbeat ───────────────────────────────────────────────────────────────

message HeartbeatRequest {
  string node_id        = 1;
  int64  timestamp_unix = 2;
  bool   bgp_session_up = 3;
  string status         = 4; // "healthy" | "degraded"
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

// ─── Node List ───────────────────────────────────────────────────────────────

message NodeInfo {
  string node_id        = 1;
  uint32 asn            = 2;
  string state          = 3; // "active" | "down" | "pending"
  string wg_ip          = 4;
  string assigned_subnet = 5;
  string public_ip      = 6;
  int64  last_heartbeat  = 7; // unix timestamp
  bool   bgp_session_up  = 8;
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

// ─── Route Info ──────────────────────────────────────────────────────────────

message RouteEntry {
  string prefix   = 1;
  string next_hop = 2;
  string source   = 3; // "static" | "bgp-node" | "bgp-upstream"
  bool   active   = 4;
}

message ListRoutesResponse {
  repeated RouteEntry routes = 1;
}

// ─── Core Service (for reference) ────────────────────────────────────────────

service CoreService {
  rpc Register    (RegisterRequest)   returns (RegisterResponse);
  rpc Heartbeat   (HeartbeatRequest)  returns (HeartbeatResponse);
  rpc ListNodes   (google.protobuf.Empty) returns (ListNodesResponse);
  rpc ListRoutes  (google.protobuf.Empty) returns (ListRoutesResponse);
  rpc DeleteNode  (DeleteNodeRequest) returns (google.protobuf.Empty);
}

message DeleteNodeRequest {
  string node_id = 1;
}
